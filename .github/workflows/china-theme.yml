name: Publish China themed site

on:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/china-theme.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate China themed dashboard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          assert '/* CHINA-THEME-2026 */' in text, 'China visual theme is missing'
          assert 'FOTOS-INTEGRADAS-2' in text, 'Embedded-photo dashboard is missing'
          assert 'const DATA=' in text and 'const ASSETS=' in text
          assert text.count('data:image/jpeg;base64,') >= 6
          assert '中国之旅' in text
          assert '#8f202d' in text or '#9c2635' in text
          print('China theme and embedded photos validated.')
          PY

      - name: Prepare Pages artifact
        shell: bash
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public page contains the China theme
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          python - <<'PY'
          import os,time,urllib.request
          url=os.environ['PAGE_URL']
          for attempt in range(12):
              try:
                  req=urllib.request.Request(
                      url+'?theme=china-2026&check='+str(int(time.time())),
                      headers={'Cache-Control':'no-cache','User-Agent':'ChinaTripThemeVerification/1.0'}
                  )
                  with urllib.request.urlopen(req,timeout=30) as r:
                      text=r.read().decode('utf-8')
                  assert '/* CHINA-THEME-2026 */' in text
                  assert '中国之旅' in text
                  print('Public themed page verified:',url)
                  break
              except Exception as e:
                  print('Waiting for themed publication:',e,flush=True)
                  if attempt==11: raise
                  time.sleep(10)
          PY
