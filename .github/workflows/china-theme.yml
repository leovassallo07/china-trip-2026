name: Apply China visual theme

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/china-theme.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply China-inspired design
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          marker = "/* CHINA-THEME-2026 */"

          css = r"""
          /* CHINA-THEME-2026 */
          :root{
            --bg:#f4eee2;
            --panel:#fffaf0;
            --text:#27231e;
            --muted:#71695e;
            --line:#dfd1b9;
            --accent:#8f202d;
            --accent2:#efe0cc;
            --warm:#f6ead8;
            --green:#e4ece4;
            --gold:#c69a4a;
            --jade:#31594f;
            --ink:#25211d;
            --cinnabar:#9c2635;
          }

          body{
            background:
              radial-gradient(circle at 12% 7%,rgba(198,154,74,.10),transparent 25rem),
              radial-gradient(circle at 92% 28%,rgba(143,32,45,.06),transparent 27rem),
              linear-gradient(180deg,#f7f1e6 0%,#f2ebdf 100%);
            color:var(--text);
          }

          body:before{
            content:"";
            position:fixed;
            inset:0;
            z-index:-1;
            opacity:.20;
            pointer-events:none;
            background-image:
              linear-gradient(45deg,transparent 46%,rgba(143,32,45,.09) 47%,rgba(143,32,45,.09) 53%,transparent 54%),
              linear-gradient(-45deg,transparent 46%,rgba(143,32,45,.09) 47%,rgba(143,32,45,.09) 53%,transparent 54%);
            background-size:38px 38px;
            mask-image:linear-gradient(to bottom,rgba(0,0,0,.45),transparent 36%);
          }

          .wrap{max-width:1220px;padding:30px 20px 64px}

          .version-badge{
            background:#f5ead5;
            color:#7d5425;
            border:1px solid #d8bd8b;
            border-radius:7px;
            letter-spacing:.08em;
            text-transform:uppercase;
            font-size:10px;
            padding:7px 10px;
          }

          .hero{
            position:relative;
            isolation:isolate;
            overflow:hidden;
            background:
              linear-gradient(112deg,rgba(44,19,17,.26),transparent 48%),
              linear-gradient(135deg,#651d28 0%,#922734 55%,#6b1d26 100%);
            border:1px solid rgba(213,176,105,.72);
            box-shadow:0 22px 55px rgba(77,35,26,.16);
            border-radius:24px;
            padding:42px;
          }

          .hero:before{
            content:"";
            position:absolute;
            inset:12px;
            z-index:-1;
            border:1px solid rgba(231,200,143,.38);
            border-radius:17px;
            pointer-events:none;
          }

          .hero:after{
            content:"中国之旅";
            position:absolute;
            right:27px;
            top:24px;
            color:#f1d7a2;
            border:2px solid rgba(241,215,162,.76);
            padding:8px 7px;
            font-family:Georgia,"Times New Roman",serif;
            font-size:18px;
            line-height:1.05;
            letter-spacing:3px;
            writing-mode:vertical-rl;
            opacity:.88;
            border-radius:3px;
          }

          .hero h1{
            font-family:Georgia,"Times New Roman",serif;
            font-weight:400;
            letter-spacing:-.04em;
            max-width:720px;
            text-wrap:balance;
          }

          .hero h1:after{
            content:"";
            display:block;
            width:82px;
            height:2px;
            margin-top:18px;
            background:linear-gradient(90deg,#e4bc74,transparent);
          }

          .hero p{
            opacity:.88;
            max-width:610px;
            line-height:1.65;
          }

          .hero .meta{gap:12px;padding-right:42px}
          .pill{
            background:rgba(255,248,233,.095);
            border:1px solid rgba(231,200,143,.32);
            border-radius:10px;
            backdrop-filter:blur(4px);
          }
          .pill b{color:#ffe8ba;font-weight:700}

          .city-tabs{
            position:relative;
            margin:26px 0 22px;
            padding-bottom:14px;
            border-bottom:1px solid #dac9aa;
          }
          .city-tabs:before{
            content:"旅程 · ITINERARIO";
            width:100%;
            margin-bottom:9px;
            color:#8f6f3d;
            font-size:10px;
            font-weight:800;
            letter-spacing:.16em;
          }

          button{
            border-color:#d8c9af;
            background:#fffaf0;
            color:#403a31;
            border-radius:9px;
            transition:transform .16s ease,background .16s ease,border-color .16s ease,color .16s ease;
          }
          button:hover{transform:translateY(-1px);border-color:#bd9250}
          button:focus-visible{outline:3px solid rgba(198,154,74,.4);outline-offset:2px}
          button.active{
            background:var(--cinnabar);
            border-color:var(--cinnabar);
            color:#fff8ec;
            box-shadow:0 5px 16px rgba(143,32,45,.14);
          }

          #cities button:nth-child(1):after{content:" · 北京";font-weight:500;opacity:.8}
          #cities button:nth-child(2):after{content:" · 上海";font-weight:500;opacity:.8}
          #cities button:nth-child(3):after{content:" · 深圳";font-weight:500;opacity:.8}

          .grid{gap:20px;align-items:stretch}
          .card{
            background:rgba(255,250,240,.94);
            border-color:#decfb5;
            border-radius:16px;
            box-shadow:0 8px 28px rgba(74,53,33,.055);
          }

          .grid>.card{
            background:
              linear-gradient(180deg,rgba(231,238,230,.78),rgba(255,250,240,.94));
            border-top:3px solid var(--jade);
          }

          .photo{
            min-height:365px;
            border-radius:150px 150px 18px 18px;
            border:1px solid #d2b77e;
            box-shadow:0 10px 30px rgba(75,50,28,.10);
          }

          .photo:before{
            content:"";
            position:absolute;
            inset:10px;
            border:1px solid rgba(246,224,180,.44);
            border-radius:140px 140px 12px 12px;
            z-index:2;
            pointer-events:none;
          }

          .photo:after,.place:after{
            background:linear-gradient(180deg,rgba(24,20,17,.02) 25%,rgba(26,20,17,.82) 100%);
          }

          .photo-copy{left:30px;right:30px;bottom:25px}
          .photo-copy h2{
            font-family:Georgia,"Times New Roman",serif;
            font-weight:400;
            letter-spacing:-.02em;
          }
          .photo-caption{top:31px;text-align:center}
          .photo-caption b{
            background:rgba(31,47,37,.74);
            border:1px solid rgba(245,226,188,.34);
            border-radius:18px;
            padding:7px 11px;
          }

          .kicker{
            color:#8d6a36;
            letter-spacing:.15em;
            font-size:10px;
          }
          .kicker:before{
            content:"";
            display:inline-block;
            width:7px;height:7px;
            margin-right:7px;
            background:var(--cinnabar);
            transform:rotate(45deg);
            vertical-align:1px;
          }

          .bigtemp{
            color:var(--jade);
            font-family:Georgia,"Times New Roman",serif;
            font-weight:400;
            letter-spacing:-.04em;
          }

          .soft{
            background:rgba(255,252,244,.82);
            border-color:#d6d8c7;
            border-radius:10px;
          }
          .soft h3{font-family:Georgia,"Times New Roman",serif;font-size:18px;font-weight:400}

          .day-tabs{gap:7px}
          .day-tabs button{font-size:12px;padding:10px 13px;border-radius:7px}
          .day-tabs button.active{background:var(--jade);border-color:var(--jade)}

          #planTitle{
            font-family:Georgia,"Times New Roman",serif;
            font-weight:400;
            color:#342a21;
            font-size:clamp(24px,3vw,31px)!important;
          }

          #plan{
            color:#665f55!important;
            max-width:960px;
          }

          .places{gap:14px}
          .place{
            border-radius:11px;
            border-color:#d2b77e;
            box-shadow:0 8px 20px rgba(58,39,25,.075);
          }
          .place:before{
            content:"";
            position:absolute;
            inset:7px;
            border:1px solid rgba(245,224,181,.34);
            z-index:2;
            border-radius:7px;
            pointer-events:none;
          }
          .place-copy{left:18px;right:18px;bottom:18px}
          .place-copy small{color:#eee2cc;opacity:.87}

          .timeline{gap:10px}
          .stop{
            position:relative;
            overflow:hidden;
            background:#fffaf0;
            border-color:#ddceb2;
            border-radius:8px;
            border-top:3px solid var(--cinnabar);
            padding:16px 13px 13px;
            color:#615a50;
          }
          .stop:before{
            content:"";
            position:absolute;
            top:-8px;right:-8px;
            width:30px;height:30px;border-radius:50%;
            background:rgba(198,154,74,.13);
          }
          .stop strong{color:#8c2730;font-family:Georgia,"Times New Roman",serif;font-size:15px}

          .credits{
            background:#efe7d8;
            border-color:#d6c3a1;
            color:#655f54;
            border-radius:12px;
          }
          .credits summary{color:#754e24}
          .credits a{color:#31594f}

          @media(max-width:800px){
            .hero{padding:30px 24px}
            .hero:after{right:16px;top:18px;font-size:14px;opacity:.55}
            .hero .meta{padding-right:0}
            .photo{min-height:330px;border-radius:105px 105px 15px 15px}
            .photo:before{border-radius:98px 98px 10px 10px}
          }

          @media(max-width:600px){
            .wrap{padding-left:14px;padding-right:14px}
            .hero{border-radius:18px}
            .hero .meta{grid-template-columns:1fr 1fr}
            .pill{padding:12px}
            #cities{display:grid;grid-template-columns:1fr}
            #cities button{width:100%}
            .city-tabs:before{grid-column:1/-1}
            .photo{min-height:300px}
          }

          @media(prefers-reduced-motion:reduce){
            button{transition:none}
            button:hover{transform:none}
          }
          """

          if marker in html:
              html = re.sub(r'/\* CHINA-THEME-2026 \*/.*?(?=</style>)', css.strip()+"\n", html, flags=re.S)
          else:
              html = html.replace("</style>", css+"\n</style>", 1)

          path.write_text(html, encoding="utf-8")

          # Lightweight assertions: preserve the embedded itinerary + photos and ensure theme landed once.
          out = path.read_text(encoding="utf-8")
          assert out.count(marker) == 1
          assert 'const DATA=' in out and 'const ASSETS=' in out
          assert out.count('data:image/jpeg;base64,') >= 6
          assert '中国之旅' in out and '北京' in out and '上海' in out and '深圳' in out
          print("China theme applied successfully:", len(out), "characters")
          PY

      - name: Commit themed index
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Apply China-inspired visual theme'
          git push origin HEAD:main
