name: Final mission agenda
on:
  push:
    branches: [main]
    paths: ['.github/workflows/final-agenda.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Apply final agenda
        shell: python
        run: |
          from pathlib import Path
          import json,re
          p=Path("index.html"); h=p.read_text(encoding="utf-8")
          D={
           "Beijing":[
            {"date":"4 nov","weekday":"Miércoles","temp":"0–12 °C","weather":"Frío y seco","plan":"17:40 · Llegada AF382 desde París a Beijing Capital (PEK), Terminal 2. Recogida y traslado privado al Hilton Beijing. 20:00 · Reunión en el lobby para briefing de la agenda.","clothes":"Abrigo, capas, pantalón largo y calzado cerrado.","places":["Beijing Capital · T2","Hilton Beijing","Briefing de llegada"]},
            {"date":"5 nov","weekday":"Jueves","temp":"0–12 °C","weather":"Frío y seco","plan":"07:30 · Desayuno y salida al Beijing Center. 08:00 · Conferencia Introducción a la Cultura China, Prof. David Moser. 10:20 · Negocios en China: Oportunidades y Retos, Prof. Narissa Dai. 12:40 · Almuerzo. 14:00 · Traslado y visita a Lenovo. 17:00 · Cena/banquete de estilo imperial. 20:00 · Hotel.","clothes":"Abrigo medio/grueso, capas y zapatos cómodos.","places":["The Beijing Center","Lenovo","Cena de bienvenida"]},
            {"date":"6 nov","weekday":"Viernes","temp":"0–12 °C","weather":"Frío y seco","plan":"06:00–08:00 · Desayuno. 08:45 · Salida a la Embajada de Colombia. 09:00 · Reunión con el Embajador y su equipo. 11:00 · Central University of Finance and Economics (CUFE). 13:30 · Almuerzo. 15:00 · iFLYTEK: IA, voz, lenguaje y educación inteligente. 17:00 · Hotel.","clothes":"Abrigo, capas y vestuario cómodo de agenda académica.","places":["Embajada de Colombia","CUFE","iFLYTEK"]},
            {"date":"7 nov","weekday":"Sábado","temp":"0–12 °C","weather":"Frío y seco","plan":"06:00–07:00 · Desayuno. 07:45 · Beijing Center. 08:00 · Conferencia sobre innovación, Gobierno, mercado y energías renovables. 10:00 · El ascenso económico de China, Prof. Timothy Bian. 12:00 · Almuerzo. 14:00 · Ciudad Prohibida y Plaza de Tiananmén. 17:00 · Hotel.","clothes":"Abrigo, capas y calzado muy cómodo.","places":["The Beijing Center","Ciudad Prohibida","Plaza de Tiananmén"]},
            {"date":"8 nov","weekday":"Domingo","temp":"0–12 °C","weather":"Frío; posible viento","plan":"06:30–08:00 · Desayuno. 08:30 · Gran Muralla, sección Mutianyu; ascenso en cable car y recorrido. 13:00 · Almuerzo junto a la Muralla. 15:00 · Regreso a Beijing para compras o recorridos libres sugeridos en Planify. 18:00 · Hotel.","clothes":"Abrigo cortaviento, capas y calzado con buen agarre.","places":["Gran Muralla · Mutianyu","Cable car","Tiempo libre en Beijing"]}],
           "Shanghai":[
            {"date":"9 nov","weekday":"Lunes","temp":"8–18 °C","weather":"Templado y húmedo","plan":"05:00 · Salida a estación. 06:50 · Tren G3 a Shanghái, primera clase. 11:30 · Llegada y traslado a THE ONE Shanghai Downtown – Vignette Collection by IHG. 13:00 · Almuerzo. 14:30 · Salida a WhalesBot. 15:30 · Visita y reuniones sobre robótica educativa, programación e IA. 17:00 · Hotel.","clothes":"Chaqueta o suéter ligero y calzado cerrado.","places":["Tren G3 · primera clase","THE ONE Shanghai Downtown","WhalesBot"]},
            {"date":"11 nov","weekday":"Miércoles","temp":"8–18 °C","weather":"Templado y húmedo","plan":"07:30 · Desayuno. 08:30 · China Electronics Fair 2026: semiconductores, componentes, IA, robótica y manufactura avanzada. 13:00 · Almuerzo. 14:30 · Recorrido por Nanjing Road, The Bund y piso 88 de Jin Mao Tower. 17:30 · Hotel.","clothes":"Chaqueta ligera o suéter, calzado cómodo e impermeable/paraguas compacto.","places":["China Electronics Fair 2026","The Bund","Jin Mao Tower"]}],
           "Hangzhou":[
            {"date":"10 nov","weekday":"Martes","temp":"≈9–17 °C","weather":"Fresco; referencia climatológica","plan":"06:00 · Desayuno en Shanghái. 07:30 · Salida a Hangzhou. 10:00 · Unitree Robotics: robótica humanoide, cuadrúpedos e IA incorporada. 12:00 · Almuerzo. 14:30 · Zhejiang Digital Education Port: IA aplicada a educación, smart campuses, realidad virtual y laboratorios digitales. 17:00 · Regreso a Shanghái.","clothes":"Chaqueta media, capas ligeras y calzado cómodo.","places":["Unitree Robotics","Zhejiang Digital Education Port","Hangzhou · 杭州"]}],
           "Shenzhen":[
            {"date":"12 nov","weekday":"Jueves","temp":"18–23 °C","weather":"Cálido y húmedo","plan":"06:15 · Aeropuerto. 09:10 · China Eastern MU5331 Shanghái → Shenzhen. 11:40 · Pullman Shenzhen North Station. 12:30 · Almuerzo. 14:30 · Visita prevista a BYD / DOBOT / MAXVISION. 16:30 · Visita prevista a Shenzhen University / Shenzhen Technology University / Shenzhen Polytechnic University. 18:00 · Hotel. Las visitas específicas pueden cambiar según la organización.","clothes":"Ropa ligera y fresca; chaqueta liviana.","places":["Vuelo MU5331","Pullman Shenzhen North Station","Empresa + universidad"]},
            {"date":"13 nov","weekday":"Viernes","temp":"18–23 °C","weather":"Cálido y húmedo","plan":"09:30 · Conferencia Smart Cities, Digital Governance y Automatización con José Antonio Vigara. 11:30 · Cómo convertir investigación universitaria en productos, startups, patentes y spin-offs con Camila Algecira. 12:30 · Almuerzo. 17:30 · Huaqiangbei.","clothes":"Ropa ligera y calzado para caminar.","places":["Conferencias de innovación","Huaqiangbei","Ecosistema tecnológico"]},
            {"date":"14 nov","weekday":"Sábado","temp":"18–23 °C","weather":"Cálido y húmedo","plan":"09:30 · Recorrido Shenzhen, la ciudad del futuro: Futian, Shenzhen Civic Center, Nanshan, Shenzhen Talent Park, Shenzhen Bay y Shenzhen Bay Culture Park / Houhai. 12:30 · Almuerzo. 14:30 · Tarde libre para compras.","clothes":"Ropa ligera, chaqueta liviana y calzado cómodo.","places":["Futian + Civic Center","Nanshan + Shenzhen Bay","Compras"]},
            {"date":"15 nov","weekday":"Domingo","temp":"18–23 °C","weather":"Cálido y húmedo","plan":"12:00 · Check-out; equipaje en el hotel. 15:00 · Traslado al aeropuerto. Vuelo KL8817 operado por China Eastern MU5352 Shenzhen → Shanghái; salida 19:10 y llegada 21:25 según tiquete. Fin de la misión; el viaje continúa desde Shanghái.","clothes":"Ropa cómoda de viaje y capa ligera para el avión.","places":["Check-out Pullman","Shenzhen Bao’an Airport","MU5352 / KL8817"]}]}
          h,n=re.subn(r'const DATA=\{.*?\};\nconst ASSETS=','const DATA='+json.dumps(D,ensure_ascii=False,separators=(",",":"))+';\nconst ASSETS=',h,count=1,flags=re.S); assert n==1
          h=h.replace('<h1>Tu viaje, día por día.</h1>','<h1>Misión China 2026 · agenda final.</h1>',1)
          h=h.replace('Una vista visual del itinerario con clima estimado, ropa sugerida, actividades y movimientos principales.','Agenda oficial de la misión, vuelos, tren, hoteles, clima, vestuario y guía práctica.',1)
          h=h.replace('<div class="pill"><b>3 ciudades</b><br><span style="opacity:.75">Beijing · Shanghai · Shenzhen</span></div>','<div class="pill"><b>4 ciudades</b><br><span style="opacity:.75">Beijing · Shanghai · Hangzhou · Shenzhen</span></div>',1)
          h=h.replace('<div class="pill"><b>1 maleta</b><br><span style="opacity:.75">facturada incluida</span></div>','<div class="pill"><b>Equipaje misión</b><br><span style="opacity:.75">20 kg + mano 12 kg</span></div>',1)
          h=h.replace('<div class="stop"><strong>9 nov</strong>Beijing → Shanghai</div>','<div class="stop"><strong>9 nov</strong>Beijing → Shanghai · tren G3</div>\n      <div class="stop"><strong>10 nov</strong>Shanghai ⇄ Hangzhou · visita del día</div>',1)
          h=h.replace('<div class="stop"><strong>12 nov</strong>Shanghai → Shenzhen</div>','<div class="stop"><strong>12 nov</strong>Shanghai → Shenzhen · MU5331</div>',1)
          h=h.replace('<div class="stop"><strong>15 nov</strong>Shenzhen → Shanghai</div>','<div class="stop"><strong>15 nov</strong>Shenzhen → Shanghai · MU5352 / KL8817</div>',1)
          h=re.sub(r"const CITY_PHOTOS=\{.*?\};","const CITY_PHOTOS={Beijing:'forbidden',Shanghai:'bund',Hangzhou:'yu',Shenzhen:'shenzhen'};",h,count=1)
          h=re.sub(r"function photoKey\(name,c\)\{.*?\}\nfunction heroKey","function photoKey(name,c){const n=name.toLowerCase();if(n.includes('mutianyu')||n.includes('muralla'))return 'wall';if(n.includes('prohibida')||n.includes('tiananm'))return 'forbidden';if(n.includes('hangzhou')||n.includes('unitree')||n.includes('zhejiang'))return 'yu';if(n.includes('bund')||n.includes('jin mao')||n.includes('shanghai')||n.includes('whalesbot')||n.includes('electronics'))return 'bund';if(n.includes('shenzhen')||n.includes('huaqiangbei')||n.includes('futian')||n.includes('nanshan')||n.includes('bao'))return 'shenzhen';return CITY_PHOTOS[c];}\nfunction heroKey",h,count=1,flags=re.S)
          h=re.sub(r"function heroKey\(d\)\{.*?\}\nfunction image","function heroKey(d){const n=parseInt(d.date,10);if(city==='Beijing'&&n===8)return 'wall';if(city==='Hangzhou')return 'yu';return CITY_PHOTOS[city];}\nfunction image",h,count=1,flags=re.S)
          marker='FINAL-AGENDA-2026-09-30'
          section='''<!-- FINAL-AGENDA-2026-09-30 --><section class="card mission-guide" id="guia-practica" style="margin-top:18px"><div class="kicker">Guía práctica · 出行指南</div><h2 style="margin:6px 0 8px">Antes de viajar a China</h2><p class="mission-intro">Información consolidada de la sesión final de la misión. Verifica requisitos variables con aerolíneas y autoridades antes de viajar.</p><div class="mission-guide-grid"><article><b>🧳 Equipaje</b><span>La organización indicó máximo <strong>20 kg facturados + 12 kg de mano</strong>. Lleva una muda y esenciales en cabina. Confirma el límite final con cada aerolínea.</span></article><article><b>🛂 Arrival Card</b><span>La organización recomienda completarla con anticipación. El trámite oficial es gratuito y también puede hacerse al llegar.</span><a href="https://s.nia.gov.cn/ArrivalCardFillingPC/" target="_blank" rel="noopener">Sitio oficial NIA ↗</a></article><article><b>📱 Apps útiles</b><span><strong>Planify</strong> para agenda; <strong>WeChat</strong> para comunicación; <strong>Alipay</strong> como opción de pago.</span><a href="https://download.planify.com" target="_blank" rel="noopener">Planify ↗</a></article><article><b>🔌 Electricidad</b><span>Referencia entregada: <strong>220 V · 50 Hz</strong>; enchufes A / C / I. Lleva adaptador universal.</span></article><article><b>🔋 Power bank</b><span>La presentación advierte sobre restricciones y recomienda marcación <strong>CCC</strong>. Llévala en cabina y verifica capacidad permitida.</span></article><article><b>🩺 Seguro y medicamentos</b><span>Para la misión se indicó <strong>seguro médico internacional obligatorio</strong> y copia del certificado. Lleva medicamentos habituales.</span></article></div></section><section class="card hotels-guide" id="hoteles" style="margin-top:18px"><div class="kicker">Alojamiento · 住宿</div><h2 style="margin:6px 0 14px">Hoteles de la agenda</h2><div class="hotel-grid"><article><span class="hanzi">北京</span><b>Hilton Beijing</b><small>1 Dong Fang Rd., North Dongsanhuan Rd., Beijing 100027</small><a href="https://www.hilton.com/en/hotels/bjshtw-hilton-beijing/" target="_blank" rel="noopener">Hotel ↗</a></article><article><span class="hanzi">上海</span><b>THE ONE Shanghai Downtown</b><small>Vignette Collection by IHG · 601 Fengyang Road, Jing'an District</small></article><article><span class="hanzi">深圳</span><b>Pullman Shenzhen North Station</b><small>No. 385 Mintang Road, Shenzhen 518109</small></article><article><span class="hanzi">杭州</span><b>Hangzhou · visita del día</b><small>10 nov · ida y regreso desde Shanghái; sin alojamiento indicado.</small></article></div></section><section class="card checklist-guide" id="checklist" style="margin-top:18px"><div class="kicker">Checklist · 行前清单</div><h2 style="margin:6px 0 12px">Lo esencial</h2><div class="check-grid"><span>✓ Pasaporte y tiquetes</span><span>✓ Seguro + certificado</span><span>✓ Dinero / tarjetas</span><span>✓ Arrival Card</span><span>✓ WeChat + Alipay + Planify</span><span>✓ Adaptador universal</span><span>✓ Power bank compatible</span><span>✓ Medicamentos</span><span>✓ Muda en equipaje de mano</span></div></section>'''
          if marker not in h:
              a='<section class="money-section" id="travel-money"'; pos=h.find(a); assert pos>0; h=h[:pos]+section+'\n'+h[pos:]
          old='Escribe cuánto llevas en pesos colombianos y calcula su equivalente aproximado en yuan chino y dólares estadounidenses.'
          h=h.replace(old,old+' <strong>La organización sugiere prever USD 500–600 para gastos adicionales</strong>, pues gran parte de comidas, transportes, entradas, vuelo interno y tren están contemplados.',1)
          css='''.mission-intro{color:var(--muted);line-height:1.65}.mission-guide-grid,.hotel-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.mission-guide-grid article,.hotel-grid article{border:1px solid #e6d7bd;background:#fffaf1;border-radius:12px;padding:15px;display:flex;flex-direction:column;gap:7px;line-height:1.48}.mission-guide-grid article b,.hotel-grid article b{color:#5d2727}.mission-guide-grid article span,.hotel-grid small{color:#6e655a;font-size:13px}.mission-guide-grid a,.hotel-grid a{font-size:12px;font-weight:800;color:#8f202d}.hanzi{font-family:Georgia,serif;color:#b28a45;font-size:23px}.check-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.check-grid span{padding:10px 12px;border-radius:9px;background:#f7f2e8;border:1px solid #eadfc9;font-size:12px;font-weight:700}@media(max-width:800px){.mission-guide-grid,.hotel-grid{grid-template-columns:1fr}.check-grid{grid-template-columns:1fr 1fr}}@media(max-width:480px){.check-grid{grid-template-columns:1fr}}'''
          if '.mission-guide-grid' not in h: h=h.replace('</style>',css+'\n</style>',1)
          p.write_text(h,encoding="utf-8")
          out=p.read_text(encoding="utf-8")
          for x in [marker,'"Hangzhou"','Unitree Robotics','WhalesBot','MU5331','MU5352','USD 500–600','CHINA-MONEY-CONVERTER-1']: assert x in out,x
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Update final China mission agenda"
          git push origin HEAD:main
